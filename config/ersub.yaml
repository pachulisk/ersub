server:
  host: "0.0.0.0"
  port: 8080
  max_connections: 10000
  base_url: "${SERVER_BASE_URL}"

database:
  host: "${DB_HOST:-localhost}"
  port: 5432
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  database: "ersub"
  pool_size: 20

clips:
  pool_size: 8
  rules_dir: "priv/clips"
  custom_rules_dir: "priv/clips/custom"

gateway:
  max_account_switches: 10
  upstream_timeout_ms: 600000
  max_body_size: 268435456
  ping_interval_ms: 10000

scheduling:
  sticky_session_ttl_s: 3600
  top_k: 7
  score_weights:
    priority: 1.0
    load: 1.0
    queue: 0.7
    error_rate: 0.8
    ttft: 0.5

concurrency:
  default_user_max: 5
  wait_queue_extra: 20
  wait_timeout_ms: 30000

billing:
  sync_interval_ms: 5000
  pricing_update_url: ""

auth:
  jwt_secret: "${JWT_SECRET}"
  jwt_expire_hours: 24
  oauth_providers:
    github:
      client_id: "${GITHUB_CLIENT_ID}"
      client_secret: "${GITHUB_CLIENT_SECRET}"

moderation:
  mode: "off"
  api_url: ""
  api_key: "${MODERATION_API_KEY}"
  api_keys: []
  ban_threshold: 5
  ban_window_seconds: 86400
  thresholds:
    sexual: 0.5
    hate: 0.5
    harassment: 0.5
    self-harm: 0.5
    sexual/minors: 0.5
    hate/threatening: 0.5
    violence/graphic: 0.5
    self-harm/intent: 0.5
    self-harm/instructions: 0.5
    harassment/threatening: 0.5
    violence: 0.5
    illicit: 0.5
    illicit/violent: 0.5

security:
  url_allowlist:
    enabled: false
    upstream_hosts: []
    allow_http: false
  cors:
    allowed_origins: []

payment:
  stripe:
    enabled: false
    secret_key: "${STRIPE_SECRET_KEY}"
    webhook_secret: "${STRIPE_WEBHOOK_SECRET}"
  alipay:
    app_id: "${ALIPAY_APP_ID}"
    private_key: "${ALIPAY_PRIVATE_KEY}"
    public_key: "${ALIPAY_PUBLIC_KEY}"
    notify_url: "${ALIPAY_NOTIFY_URL}"
    return_url: "${ALIPAY_RETURN_URL}"
  alipay_success_url: "${ALIPAY_SUCCESS_URL}"
  stripe_success_url: "${STRIPE_SUCCESS_URL}"
  wechat:
    mch_id: "${WECHAT_MCH_ID}"
    private_key: "${WECHAT_PRIVATE_KEY}"
    certificate_serial_no: "${WECHAT_SERIAL_NO}"
    api_v3_key: "${WECHAT_API_V3_KEY}"
    platform_public_key: "${WECHAT_PLATFORM_PUBLIC_KEY}"
    notify_url: "${WECHAT_NOTIFY_URL}"

ops:
  usage_cleanup:
    retention_days: 90
    run_at_hour: 3
  alert:
    eval_interval_ms: 60000

backend_mode: "standard"
