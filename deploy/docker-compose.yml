version: "3.8"

services:
  # Init container: generate secrets if not exist
  init-secrets:
    image: alpine:3.19
    volumes:
      - ersub_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /data/.db_password ]; then
          cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 32 > /data/.db_password
          echo "[init] Generated DB_PASSWORD"
        fi
        if [ ! -f /data/.jwt_secret ]; then
          cat /dev/urandom | tr -dc 'a-zA-Z0-9' | head -c 64 > /data/.jwt_secret
          echo "[init] Generated JWT_SECRET"
        fi
        echo "[init] Secrets ready"

  postgres:
    image: postgres:16
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ersub_data:/secrets:ro
    environment:
      - POSTGRES_DB=ersub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/secrets/.db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

  ersub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ersub_data:/app/data
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
    entrypoint: ["/app/entrypoint.sh"]
    restart: unless-stopped

volumes:
  pgdata:
  ersub_data:
